[workspace]
members = [".", "migration"]
migration = { path = "migration" }

[package]
name = "nimv2"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full", "rt"] }
actix-web = "4"
utoipa-actix-web = {version="0.1"}
utoipa={version="5", features=["actix_extras", "chrono"]}
serde = {version="1.0", features=["derive"]}
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
sea-orm = { version = "1.1.14", features = [ "sqlx-postgres","runtime-tokio", "macros", "with-chrono"] }
dotenv = "0.15.0"
chrono = "0.4"
blake2 = "0.10.6"
base64ct = {version="1.8.0", features= ["alloc"]}
strum = { version = "0.27", features = ["derive"] }
serde_json = { version = "1.0"}
parking_lot = "0.12.4"
async-trait = "0.1.89"
log = "0.4"
fast_log = { version = "1.7" }
moka = { version = "0.12.11", features = ["future"] }
ahash = "0.8.12"
bincode = {version="2.0.1", features=["serde"]}
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
image = { version = "0.25.8", features = ["default-formats"] }


[build-dependencies]
utoipa-config = "0.1"
